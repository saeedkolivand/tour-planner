# Weekly dependency PRs, one per area, grouped so they can be merged in one go.
# The app's React Native / Expo majors are left out: Expo pins them per SDK, and the SDK upgrade
# (expo@^58 + `npx expo install --fix`) is done by hand with a device pass. Tooling majors still come.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      backend: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      app: { patterns: ["*"] }
    ignore:
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      actions: { patterns: ["*"] }
