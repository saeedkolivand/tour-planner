# Weekly dependency PRs, one per area, grouped so they can be merged in one go.
# The app's React Native / Expo majors are left out: Expo pins them per SDK, and the SDK upgrade
# (expo@^58 + `npx expo install --fix`) is done by hand with a device pass. Tooling majors still come.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      backend: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      app: { patterns: ["*"] }
    ignore:
      # pinned exactly by the Expo SDK (native code must match): `npx expo install --fix` moves them, not PRs
      - dependency-name: "expo*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native*"
      - dependency-name: "@react-native*"
      - dependency-name: "@types/react"
      # need their ecosystems to catch up first: NativeWind 4 wants Tailwind 3, eslint-config-expo's plugins
      # don't run on ESLint 10 / TypeScript 7 yet (checked 2026-09-27)
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    groups:
      actions: { patterns: ["*"] }
