# The landing page (site/, Next.js static export) on GitHub Pages. It imports the app's planner, splash geometry
# and colours, so a change to those republishes it too. Site commits use the `site` scope, which never releases the app.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - mobile/global.css
      - mobile/src/features/planner/**
      - mobile/src/components/splash/geometry.ts
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
