# Builds a release APK of mobile/ on GitHub's Linux runners. React Native's template signs the
# release build with the debug keystore that `expo prebuild` generates (android/app/debug.keystore),
# so the APK installs by sideloading only -- it is NOT suitable for the Play Store.
name: Android APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version to stamp into app.json (set by release.yml)
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Checks
        run: npm run typecheck && npm run lint && npm test

      - name: Stamp the release version into app.json
        if: inputs.version != ''
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.version='${{ inputs.version }}';
            j.expo.android={...j.expo.android,versionCode:${{ github.run_number }}};
            j.expo.ios={...j.expo.ios,buildNumber:'${{ github.run_number }}'};
            fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'
')"
          grep -E '"(version|versionCode|buildNumber)"' app.json

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # Build cache reuses the Reanimated/worklets/RN C++ compile (the bulk of the 24 min) across runs when inputs match.
      - name: Build (Release APK)
        run: cd android && ./gradlew assembleRelease --no-daemon --build-cache

      - run: cp android/app/build/outputs/apk/release/app-release.apk TourPlanner.apk

      - uses: actions/upload-artifact@v7
        with:
          name: TourPlanner-apk
          path: mobile/TourPlanner.apk
          retention-days: 30
